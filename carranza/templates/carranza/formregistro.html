{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO</title>
    <link rel="stylesheet" href="{% static 'lozano/estilos.css' %}">
</head>
<body>
    <!-- ENCABEZADO -->
    <header>
        <h1>REGISTRA TUS DATOS</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <ul>
                <li><a href="inicio">INICIO</a></li>
                <li><a href="registro">REGISTRO</a></li>
                <li><a href="#">dos</a></li>
                <li><a href="#">tres</a></li>
            </ul>
        </nav>
    </header>
<form method="POST">
    <label class="titulos">Nombre:</label>
    <input type="text" name="nombre" placeholder="Escribe tu nombre..." required>
    <label class="titulos">Apellido Paterno</label>
    <input type="text" name="apellidop" placeholder="Escribe tu apellido Paterno" required>
    <label class="titulos">Apellido Materno:</label>
    <input type="text" name="apellidom" placeholder="Escribe tu apellido Materno">
    <label class="titulos">Edad:</label>
    <input type="number" name="edad" min="14" max="25" placeholder="Escribe tu edad.." required>
    <label class="titulos">Genero:</label><br><br>
    <input type="radio" name="genero" value="Femenino"><label class="genero">Femenino</label>
    <input type="radio" name="genero" value="Masculino"><label class="genero">Masculino</label><br><br>
    <label class="titulos">Intereses:</label><br><br>
    <input type="checkbox" name="intereses" value="Futbol"><label class="radio">  Futbol  </label>
    <input type="checkbox" name="intereses" value="Musica">Musica
    <input type="checkbox" name="intereses" value="Videojuegos">Videojuegos
    <input type="checkbox" name="intereses" value="Salirapasear"> Salir a Pasear
    <button type="submit">Guardar</button>
</form>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>ESTE TRABAJO FUE ELABORADO POR BRENDA ANAHI LOZANO</p>
    </footer>

</body>
</html>
