{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTROCOFFEE</title>
    <link rel="stylesheet" href="{% static 'carranza/estilos.css' %}">
</head>
<body>
    <!-- ENCABEZADO -->
    <header>
        <h1>REGISTRA TU BEBIDA</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <ul>
                <li><a href="inicio">INICIO</a></li>
                <li><a href="registro">REGISTRO</a></li>
                <li><a href="registrocoffee">REGISTROCOFFEE</a></li>
                <li><a href="#">tres</a></li>
            </ul>
        </nav>
    </header>
<form method="POST">
    <label class="titulos">bebida faborita</label>
    <input type="text" name="hablame sobre tu bebida faborita" placeholder="Escribe tu bebida faborita..." required>
    <label class="titulos">realizacion de tu ultima compra</label>
    <input type="text" name="ultima compra" placeholder="Escribe la fecha" required>
    <input type="number" name="edad" min="1" max="5" placeholder="Escribe la cantidad.." required>
    <label class="titulos">que tamaño prefieres</label><br><br>
    <input type="radio" name="grande" value="mediano"><label class="chico">tamaño</label>
    <input type="radio" name="genero" value="Masculino"><label class="genero">Masculino</label><br><br>
    <label class="titulos">Intereses:</label><br><br>
    <input type="checkbox" name="intereses" value="Futbol"><label class="radio">  Futbol  </label>
    <input type="checkbox" name="intereses" value="Musica">Musica
    <input type="checkbox" name="intereses" value="Videojuegos">Videojuegos
    <input type="checkbox" name="intereses" value="Salirapasear"> Salir a Pasear
    <button type="submit">Guardar</button>
</form>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>ESTE TRABAJO FUE ELABORADO POR BRENDA ANAHI LOZANO</p>
    </footer>

</body>
</html>
